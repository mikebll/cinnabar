name: Package

# A daily schedule or a manual `nightly` run refreshes the default branch's nightly prerelease;
# other manual runs and v* tags publish tagged Beta releases as latest. Android requires its release
# keystore; desktop signing is optional. Without CINNABAR_UPDATE_SIGNING_KEY the channel's update manifest is left unchanged.
on:
  schedule:
    - cron: "30 3 * * *"
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: Cinnabar app version (independent of the Minecraft protocol), or nightly to refresh its prerelease
        required: true
        default: current
        type: choice
        options: [current, patch, minor, major, custom, nightly]
      version:
        description: Custom app version X.Y.Z (only for custom)
        type: string
      branch:
        description: Branch to release (blank uses the selected workflow branch)
        type: string

concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.bump == 'nightly') && 'package-nightly' || 'package-release' }}
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: source

env:
  UPDATE_TRUSTED_KEYS: ${{ vars.UPDATE_TRUSTED_KEYS }}
  CARGO_BUILD_BUILD_DIR: "{workspace-root}/target"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "line-tables-only"
  CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "packed"
  CARGO_PROFILE_RELEASE_STRIP: "debuginfo"
  CINNABAR_SOURCE_ROOT: ${{ github.workspace }}/source

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      track: ${{ steps.release.outputs.track }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      ref: ${{ steps.release.outputs.ref }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.branch || github.ref_name) || github.sha }}
          path: source
      - name: Check out release tooling from the workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - name: Resolve the version, tag, and build commit
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUMP: ${{ inputs.bump || 'current' }}
          CUSTOM_VERSION: ${{ inputs.version }}
          TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: python3 "$GITHUB_WORKSPACE/release-tools/packaging/prepare-release.py"

  fedora:
    name: Fedora x86_64
    permissions:
      contents: read
      actions: write
    needs: prepare
    runs-on: ubuntu-24.04
    container: fedora:latest
    timeout-minutes: 120
    # Anulamos la configuración global de source para que el contenedor pueda iniciar correctamente
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      CINNABAR_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      APPIMAGE_EXTRACT_AND_RUN: 1
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
      APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
      APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
      CARGO_PROFILE_RELEASE_STRIP: "none"
    steps:
      - name: Install base dependencies for checkout and Rust
        run: |
          dnf update -y
          dnf install -y git curl gcc gcc-c++ make tar findutils python3
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
          path: source
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - name: Resolve the downloadable artifact name
        working-directory: source
        run: python3 "$GITHUB_WORKSPACE/release-tools/packaging/release-downloads.py" env linux x86_64 --version "${{ needs.prepare.outputs.version }}" >> "$GITHUB_ENV"
      - name: Install the pinned Rust toolchain
        working-directory: source
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup toolchain install
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Restore Rust release build cache
        id: rust-cache
        uses: ./release-tools/.github/actions/build-cache
        with:
          workspace: source
          lane: release
          store: artifact
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false
      - name: Restore Go build cache
        id: go-cache
        uses: ./release-tools/.github/actions/build-cache
        with:
          workspace: source
          language: go
          lane: release
          store: artifact
      - name: Install Fedora build and packaging dependencies
        working-directory: source
        run: |
          dnf install -y wayland-devel libxkbcommon-devel alsa-lib-devel systemd-devel librsvg2-tools file
          fetch() {
            curl --fail --location --silent --show-error --output "$1" "$2"
            echo "$3  $1" | sha256sum --check --strict
          }
          fetch "$RUNNER_TEMP/appimagetool" "$APPIMAGETOOL_URL" "$APPIMAGETOOL_SHA256"
          fetch "$RUNNER_TEMP/appimage-runtime" "$APPIMAGE_RUNTIME_URL" "$APPIMAGE_RUNTIME_SHA256"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$RUNNER_TEMP/appimage-runtime" >> "$GITHUB_ENV"
      - name: Package
        working-directory: source
        run: |
          make package-binaries PACKAGE_CARGO_FLAGS=--timings
          shipped="$RUNNER_TEMP/release-binaries"
          python3 "$GITHUB_WORKSPACE/release-tools/packaging/release-symbols.py" split target/release "$shipped"
          BINARIES="$shipped" ASSETC="$shipped/assetc" bash "$GITHUB_WORKSPACE/release-tools/packaging/linux/build-appimage.sh"
          mv .local/dist/linux-release/Cinnabar-*-x86_64.AppImage "$RUNNER_TEMP/$RELEASE_ASSET"
      - name: Collect release symbols
        id: symbols
        working-directory: source
        run: |
          python3 "$GITHUB_WORKSPACE/release-tools/packaging/release-symbols.py" collect linux x86_64 \
            --version "${{ needs.prepare.outputs.version }}" --commit "${{ needs.prepare.outputs.commit }}" \
            --binaries "$RUNNER_TEMP/release-binaries" --out "$RUNNER_TEMP/$SYMBOLS_ASSET"
      - name: Check the AppImage against the payload allowlist
        working-directory: source
        run: |
          cd "$RUNNER_TEMP"
          "./$RELEASE_ASSET" --appimage-extract > /dev/null
          bash "$GITHUB_WORKSPACE/release-tools/packaging/check-payload.sh" linux "$RUNNER_TEMP/squashfs-root"
      - name: Save Rust release build cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/dev' }}
        continue-on-error: true
        uses: ./release-tools/.github/actions/build-cache
        with:
          phase: save
          workspace: source
          lane: release
          store: artifact
          key: ${{ steps.rust-cache.outputs.key }}
          bucket: ${{ steps.rust-cache.outputs.bucket }}
          paths: ${{ steps.rust-cache.outputs.paths }}
          prefix: ${{ steps.rust-cache.outputs.prefix }}
      - name: Save Go build cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/dev' }}
        continue-on-error: true
        uses: ./release-tools/.github/actions/build-cache
        with:
          phase: save
          workspace: source
          language: go
          lane: release
          store: artifact
          key: ${{ steps.go-cache.outputs.key }}
          bucket: ${{ steps.go-cache.outputs.bucket }}
          paths: ${{ steps.go-cache.outputs.paths }}
          prefix: ${{ steps.go-cache.outputs.prefix }}
      - uses: actions/upload-artifact@v7
        with:
          name: fedora-x86_64
          path: ${{ runner.temp }}/${{ env.RELEASE_ASSET }}
          if-no-files-found: error
      - if: steps.symbols.outputs.archived == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: symbols-fedora-x86_64
          path: ${{ runner.temp }}/${{ env.SYMBOLS_ASSET }}
          if-no-files-found: error

      - name: Upload Rust build timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-timings-fedora-x86_64
          path: source/target/cargo-timings/cargo-timing.html
          if-no-files-found: warn

  release:
    name: Publish
    needs: [prepare, fedora]
    if: ${{ github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v') }}
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      UPDATE_SIGNED: ${{ secrets.CINNABAR_UPDATE_SIGNING_KEY != '' }}
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      RELEASE_TRACK: ${{ needs.prepare.outputs.track }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.ref }}
          path: source
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          path: source/dist
          pattern: "{fedora-x86_64,symbols-*}"
          merge-multiple: true
      - name: Resolve release metadata names
        run: python3 "$GITHUB_WORKSPACE/release-tools/packaging/release-downloads.py" env --channel "$RELEASE_CHANNEL" --tag "$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Add the standalone Linux installer
        run: python3 "$GITHUB_WORKSPACE/release-tools/packaging/release-downloads.py" install-script --output "dist/$INSTALL_SCRIPT"
      - name: Install the release tooling Rust toolchain
        if: env.UPDATE_SIGNED == 'true'
        working-directory: release-tools
        run: rustup toolchain install
      - name: Sign the update manifest
        env:
          CINNABAR_UPDATE_SIGNING_KEY: ${{ secrets.CINNABAR_UPDATE_SIGNING_KEY }}
        run: |
          if [[ -z "$CINNABAR_UPDATE_SIGNING_KEY" ]]; then
            echo "::notice::CINNABAR_UPDATE_SIGNING_KEY is unset; skipping the signed $RELEASE_CHANNEL update manifest"
            exit 0
          fi
          base="${{ github.server_url }}/${{ github.repository }}/releases/download/$UPDATE_MANIFEST_TAG"
          args=()
          while IFS= read -r spec; do
            args+=(-artifact "$spec")
          done < <(python3 "$GITHUB_WORKSPACE/release-tools/packaging/release-downloads.py" update-payloads \
            "$base" "$GITHUB_WORKSPACE/source/dist" "$RUNNER_TEMP/update-payloads")
          (cd "$GITHUB_WORKSPACE/release-tools" && cargo run --quiet --locked -p release-manifest -- \
            sign -version "$RELEASE_VERSION" -channel "$RELEASE_CHANNEL" -build-number "$GITHUB_RUN_NUMBER" "${args[@]}") \
            > "$RUNNER_TEMP/$UPDATE_MANIFEST.partial"
          mv "$RUNNER_TEMP/$UPDATE_MANIFEST.partial" "$RUNNER_TEMP/$UPDATE_MANIFEST"
      - name: Verify all downloads and checksum the release
        run: |
          symbols=()
          [[ "$(python3 "$GITHUB_WORKSPACE/release-tools/packaging/release-symbols.py" has-symbols)" == true ]] ||
            symbols=(--without-symbols)
          python3 "$GITHUB_WORKSPACE/release-tools/packaging/release-downloads.py" checksums dist \
            --version "$RELEASE_VERSION" "${symbols[@]}"
      - name: Prepare the tagged release
        id: prepare_publish
        if: needs.prepare.outputs.track == 'tagged'
        run: |
          bash "$GITHUB_WORKSPACE/release-tools/packaging/release-notes.sh" release > "$RUNNER_TEMP/notes.md"
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            previous="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')"
            notes_start=()
            if [[ -n "$previous" ]]; then
              notes_start+=(--notes-start-tag "$previous")
            fi
            gh release create "$RELEASE_TAG" --draft --latest=false --verify-tag --target "$RELEASE_COMMIT" \
              --title "$RELEASE_TAG" --generate-notes "${notes_start[@]}" --notes-file "$RUNNER_TEMP/notes.md"
            echo "created=true" >> "${GITHUB_OUTPUT:-/dev/null}"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
            [[ -e "dist/$name" || "$name" == "$UPDATE_MANIFEST" || "$name" == "$UPDATE_PAYLOAD_PREFIX"* ]] ||
              gh release delete-asset "$RELEASE_TAG" "$name" --yes
          done
      - name: Publish the signed update manifest
        id: publish_manifest
        run: |
          manifest="$RUNNER_TEMP/$UPDATE_MANIFEST"
          payloads="$RUNNER_TEMP/update-payloads"
          if [[ ! -e "$manifest" ]]; then
            echo "::notice::No signed $RELEASE_CHANNEL update manifest; the published one stays current"
            exit 0
          fi
          if ! gh release view "$UPDATE_MANIFEST_TAG" > /dev/null 2>&1; then
            [[ "$RELEASE_TRACK" == rolling ]] || { echo "::error::Tagged release was not prepared"; exit 1; }
            gh release create "$UPDATE_MANIFEST_TAG" --prerelease --latest=false --target "$RELEASE_COMMIT" \
              --title "${RELEASE_CHANNEL^} updates" --notes "Signed update manifest for the $RELEASE_CHANNEL channel."
          fi
          previous="$RUNNER_TEMP/previous-update"
          mkdir -p "$previous"
          gh release view "$UPDATE_MANIFEST_TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/published-assets"
          : > "$RUNNER_TEMP/retained-payloads"
          prune=false
          if grep -Fxq "$UPDATE_MANIFEST" "$RUNNER_TEMP/published-assets"; then
            gh release download "$UPDATE_MANIFEST_TAG" --pattern "$UPDATE_MANIFEST" --dir "$previous" --clobber
            if (cd "$GITHUB_WORKSPACE/release-tools" && cargo run --quiet --locked -p release-manifest -- \
              payload-names "$previous/$UPDATE_MANIFEST") > "$RUNNER_TEMP/retained-payloads"; then
              prune=true
            else
              echo "::notice::Cannot read the preceding manifest; retain all earlier payloads"
            fi
          fi
          : > "$RUNNER_TEMP/new-payload-names"
          for payload in "$payloads"/*; do
            name="${payload##*/}"
            printf '%s\n' "$name" >> "$RUNNER_TEMP/new-payload-names"
            if ! grep -Fxq "$name" "$RUNNER_TEMP/published-assets"; then
              gh release upload "$UPDATE_MANIFEST_TAG" "$payload"
            fi
          done
          if [[ ! -e "$previous/$UPDATE_MANIFEST" ]] || ! cmp -s "$previous/$UPDATE_MANIFEST" "$manifest"; then
            gh release upload "$UPDATE_MANIFEST_TAG" "$manifest" --clobber
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
          LC_ALL=C sort -o "$RUNNER_TEMP/new-payload-names" "$RUNNER_TEMP/new-payload-names"
          if [[ "$prune" != true ]] || cmp -s "$RUNNER_TEMP/retained-payloads" "$RUNNER_TEMP/new-payload-names"; then
            exit 0
          fi
          gh release view "$UPDATE_MANIFEST_TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
            if [[ "$name" == "$UPDATE_PAYLOAD_PREFIX"* && ! -e "$payloads/$name" ]] &&
              ! grep -Fxq "$name" "$RUNNER_TEMP/retained-payloads"; then
              gh release delete-asset "$UPDATE_MANIFEST_TAG" "$name" --yes
            fi
          done
      - name: Publish the rolling prerelease
        if: needs.prepare.outputs.track == 'rolling'
        run: |
          previous="$(git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}" || true)"
          bash "$GITHUB_WORKSPACE/release-tools/packaging/release-notes.sh" "$RELEASE_CHANNEL" "$previous" > "$RUNNER_TEMP/notes.md"
          title="${RELEASE_CHANNEL^} $(date -u +%Y-%m-%d) ($(git rev-parse --short HEAD))"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
              [[ -e "dist/$name" || "$name" == "$UPDATE_MANIFEST" || "$name" == "$UPDATE_PAYLOAD_PREFIX"* ]] ||
                gh release delete-asset "$RELEASE_TAG" "$name" --yes
            done
          else
            gh release create "$RELEASE_TAG" dist/* --prerelease --latest=false --target "$RELEASE_COMMIT" \
              --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          git tag -f "$RELEASE_TAG" "$RELEASE_COMMIT"
          git push -f origin "refs/tags/$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md" \
            --prerelease --latest=false --draft=false
      - name: Publish the tagged release
        if: needs.prepare.outputs.track == 'tagged'
        run: |
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" \
            --draft=false --prerelease=false --latest=true
      - name: Announce the release to the Cinnabar API
        if: steps.publish_manifest.outputs.published == 'true'
        continue-on-error: true
        env:
          MANIFEST_PUBLISHED: ${{ steps.publish_manifest.outputs.published }}
          CINNABAR_API_RELEASE_HOOK_SECRET: ${{ secrets.CINNABAR_API_RELEASE_HOOK_SECRET }}
        run: |
          [[ "$MANIFEST_PUBLISHED" == true ]] || exit 0
          if [[ -z "$CINNABAR_API_RELEASE_HOOK_SECRET" ]]; then
            echo "::warning::CINNABAR_API_RELEASE_HOOK_SECRET is unset; skipping the Cinnabar API release notice"
            exit 0
          fi
          base="$(jq -r '.constants[] | select(.go_name == "CinnabarAPIBaseURL") | .value' \
            "$GITHUB_WORKSPACE/release-tools/crates/bridge/data/contract.json")"
          body="$(jq -cn --arg channel "$RELEASE_CHANNEL" --arg version "$RELEASE_VERSION" --argjson build "$GITHUB_RUN_NUMBER" \
            '{channel: $channel, version: $version, build: $build}')"
          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST "$base/v1/releases" \
            -A "cinnabar-release/$RELEASE_VERSION" \
            -H @<(printf 'Authorization: Bearer %s\n' "$CINNABAR_API_RELEASE_HOOK_SECRET") \
            -H 'Content-Type: application/json' --data "$body")" || true
          if [[ "$status" != 204 ]]; then
            echo "::warning::Cinnabar API release notice failed (HTTP ${status:-none}); clients pick the release up on their next check"
          fi
      - name: Post the changelog to Discord
        if: steps.prepare_publish.outputs.created == 'true'
        continue-on-error: true
        env:
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
        run: python3 "$GITHUB_WORKSPACE/release-tools/packaging/changelog.py" discord "$RELEASE_TAG"
      - name: Report supported mod API revisions to the Cinnabar API
        env:
          CINNABAR_API_RELEASE_HOOK_SECRET: ${{ secrets.CINNABAR_API_RELEASE_HOOK_SECRET }}
        run: |
          if [[ -z "$CINNABAR_API_RELEASE_HOOK_SECRET" ]]; then
            echo "::warning::CINNABAR_API_RELEASE_HOOK_SECRET is unset; skipping the mod API revision report"
            exit 0
          fi
          base="$(jq -r '.constants[] | select(.go_name == "CinnabarAPIBaseURL") | .value' \
            "$GITHUB_WORKSPACE/release-tools/crates/bridge/data/contract.json")"
          revisions='[]'
          if [[ -f crates/mod-api/compatibility-revisions.json ]]; then
            revisions="$(jq -c . crates/mod-api/compatibility-revisions.json)"
          fi
          body="$(jq -cn --arg channel "$RELEASE_CHANNEL" --argjson revisions "$revisions" \
            '{channel: $channel, mod_api_revisions: $revisions}')"
          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 --retry-all-errors -X POST "$base/v1/mod/host-revisions" \
            -A "cinnabar-release/$RELEASE_VERSION" \
            -H @<(printf 'Authorization: Bearer %s\n' "$CINNABAR_API_RELEASE_HOOK_SECRET") \
            -H 'Content-Type: application/json' --data "$body")" || true
          if [[ "$status" != 204 ]]; then
            echo "::error::Mod API revision report failed (HTTP ${status:-none}); re-run this job to report the published build"
            exit 1
          fi
